<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILuvQ — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7c3aed; --purple-light: #ede9fe; --purple-mid: #c4b5fd;
      --bg: #f8f7ff; --white: #fff; --text: #1a1a2e; --muted: #666680; --border: #e8e4f8;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 40px; height: 60px; }
    .logo { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; color: var(--text); text-decoration: none; }
    .logo span { color: var(--purple); }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
    .content { max-width: 480px; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .big-num {
      font-family: 'Sora', sans-serif; font-size: 120px; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--purple), var(--purple-mid));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .icon-wrap { font-size: 48px; margin-bottom: 16px; }
    h2 { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 32px; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: flex; align-items: center; gap: 7px; padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; text-decoration: none; border: none; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: #5b21b6; }
    .btn-ghost { background: var(--white); color: var(--text); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--purple); color: var(--purple); }
  </style>
</head>
<body>
  <nav><a class="logo" href="index.html">I<span>❤</span>Q</a></nav>
  <div class="main">
    <div class="content">
      <div class="big-num">404</div>
      <div class="icon-wrap">🔍</div>
      <h2>Page not found</h2>
      <p>Looks like this page went missing — maybe it got lost in a PDF somewhere. Let's get you back on track.</p>
      <div class="btns">
        <a class="btn btn-primary" href="index.html"><i class="ti ti-home" style="font-size:15px"></i>Go home</a>
        <a class="btn btn-ghost" href="javascript:history.back()"><i class="ti ti-arrow-left" style="font-size:15px"></i>Go back</a>
      </div>
    </div>
  </div>
</body>
</html>
